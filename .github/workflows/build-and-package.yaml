name: Build and Package

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # För bättre SonarQube-analyser

      - name: Build and test
        uses: ./.github/actions/build
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Get image ref
        run: |
          IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY@L}
          echo "IMAGE_REF=$IMAGE_REF" >> ${GITHUB_ENV}

      - name: Get Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_REF }}

      - name: Tag image
        run: docker tag ${{ env.IMAGE_REF }} ${{ env.IMAGE_REF }}:${{ steps.meta.outputs.version }}

      - name: Tag image (latest)
        if: ${{ contains(steps.meta.outputs.tags, 'latest') }}
        run: docker tag ${{ env.IMAGE_REF }} ${{ env.IMAGE_REF }}:latest

      - name: Push to registry
        run: docker push ${{ env.IMAGE_REF }}:${{ steps.meta.outputs.version }}

      - name: Push to registry (latest)
        if: ${{ contains(steps.meta.outputs.tags, 'latest') }}
        run: docker push ${{ env.IMAGE_REF }}:latest

      - name: Get image digest
        run: |
          IMAGE_DIGEST=$(echo $(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_REF }}) | cut -d"@" -f2)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
