name: Build

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # För bättre SonarQube-analyser

      - name: Build and test
        uses: ./.github/actions/build
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
