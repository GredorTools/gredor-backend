name: Build

description: Sätter upp JDK och Gradle, samt bygger och testar applikationen.

inputs:
  sonar_token:
    description: "SONAR_TOKEN"
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: 25
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build and test
      run: ./gradlew build
      shell: bash

    - name: SonarQube Scan
      run: ./gradlew sonar
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      shell: bash
